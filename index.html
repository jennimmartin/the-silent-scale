<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title -->
    <title>The Silent Scale - Shadow Operator for Digital Creators</title>

    <!-- Meta Description -->
    <meta
      name="description"
      content="We help creators build and automate digital products on Whop. Revenue-share partnerships for 3k-100k followers. You stay visible, we stay silent."
    />

    <!-- Keywords -->
    <meta
      name="keywords"
      content="shadow operator, digital products, Whop, creator monetization, revenue share"
    />

    <!-- Open Graph (Social Media Previews) -->
    <meta
      property="og:title"
      content="The Silent Scale - Shadow Operator for Digital Creators"
    />
    <meta
      property="og:description"
      content="We help you build and automate your digital products on Whop and other platforms. Revenue-share partnerships for creators with 3k-100k followers."
    />
    <meta
      property="og:image"
      content="https://thesilentscale.com/og-image.png"
    />
    <meta property="og:url" content="https://thesilentscale.com" />
    <meta property="og:type" content="website" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Simple Analytics -->
    <script
      async
      defer
      src="https://scripts.simpleanalyticscdn.com/latest.js"
    ></script>
    <noscript
      ><img
        src="https://queue.simpleanalyticscdn.com/noscript.gif"
        alt=""
        referrerpolicy="no-referrer-when-downgrade"
    /></noscript>
  </head>
  <body>
    <div id="root"></div>

    <!-- Hidden form for Netlify Forms detection -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="audienceSize" />
      <input type="text" name="currentRevenue" />
      <textarea name="buildGoal"></textarea>
      <textarea name="biggestChallenge"></textarea>
      <input type="text" name="platforms" />
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
